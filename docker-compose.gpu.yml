# Override opcional para hosts con GPU NVIDIA y nvidia-container-toolkit instalado.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
# La GPU la usa solo el worker ASR, que es quien carga el modelo Whisper.
services:
  worker-asr:
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
