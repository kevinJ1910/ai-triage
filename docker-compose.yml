x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-triage_user}:${POSTGRES_PASSWORD:-change-me-in-production}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ai_triage}
  DATABASE_HOST: ${POSTGRES_HOST:-postgres}
  DATABASE_PORT: ${POSTGRES_PORT:-5432}
  DATABASE_NAME: ${POSTGRES_DB:-ai_triage}
  DATABASE_USER: ${POSTGRES_USER:-triage_user}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
  # Redis: broker de Celery (db 0) y cache compartida (db 1)
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  # Sin valor por defecto: compose falla si SECRET_KEY no esta definida en .env
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY debe definirse en .env}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-nginx,localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,http://localhost:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Configuracion clinica congelada validada en la particion de prueba (prompt v2 + suelo min_critico)
  TRIAGE_PROMPT_VERSION: ${TRIAGE_PROMPT_VERSION:-v2}
  TRIAGE_COMBINE_POLICY: ${TRIAGE_COMBINE_POLICY:-min_critico}
  ASR_STATUS_TTL: ${ASR_STATUS_TTL:-90}
  ASR_HEARTBEAT_INTERVAL: ${ASR_HEARTBEAT_INTERVAL:-30}
  # LLM local (perfil llm-local). Sin el perfil activo el estado lo muestra como no disponible.
  LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://llm-local:11434}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma4:e4b-it-qat}
  LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-300}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: "${EMAIL_PORT:-1025}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AI-Triage <no-reply@hospital.com>}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_triage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_triage}
      POSTGRES_USER: ${POSTGRES_USER:-triage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    # FIX-INF-001: Puerto PostgreSQL no expuesto al host. Solo accesible dentro de ai_triage_network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_triage_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage_user} -d ${POSTGRES_DB:-ai_triage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai_triage_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai_triage_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ai_triage_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ai_triage_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cantor11/ai-triage-backend:latest
    container_name: ai_triage_backend
    restart: unless-stopped
    env_file:
      - .env
    # El proceso web ya no carga Whisper ni llama a Gemini: encola en los workers y espera el resultado.
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - audio_uploads:/app/media
    networks:
      - ai_triage_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G

  # Worker ASR: un unico proceso (pool solo) con el modelo Whisper cargado una sola vez.
  # Por defecto corre en CPU (int8), valido en cualquier equipo; con GPU NVIDIA se activa
  # docker-compose.gpu.yml, que cambia a CUDA, un modelo mayor y reserva la GPU.
  worker-asr:
    image: cantor11/ai-triage-backend:latest
    container_name: ai_triage_worker_asr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      RUN_STARTUP_TASKS: "False"
      WHISPER_PRELOAD: "True"
      # 'small' mantiene la latencia por fragmento de 4 s asumible en CPU; ajustable en .env.
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
    command: ["celery", "-A", "config", "worker", "-Q", "asr", "--pool", "solo", "-n", "asr@%h", "--loglevel", "INFO"]
    volumes:
      - ./backend:/app
      # Modelos Whisper descargados: se conservan entre reinicios y reconstrucciones.
      - asr_model_cache:/home/appuser/.cache/huggingface
    networks:
      - ai_triage_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Con pool solo el ping no responde mientras transcribe: intervalo amplio y varios reintentos.
      test: ["CMD-SHELL", "celery -A config inspect ping -d asr@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 6G

  # Worker LLM: llamadas a Gemini (triaje y normalizacion) y NER clinico (RoBERTa en CPU).
  # Pool de hilos: Gemini es I/O y el modelo NER se carga una sola vez y se comparte entre hilos.
  worker-llm:
    image: cantor11/ai-triage-backend:latest
    container_name: ai_triage_worker_llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      RUN_STARTUP_TASKS: "False"
      # Por defecto descarga y cachea el modelo publico congelado de la tesis desde Hugging Face Hub;
      # tambien admite ruta local montada (/models/ner/ai_triage_ner_roberta).
      NER_MODEL_PATH: ${NER_MODEL_PATH:-HoraYMedia/ai-triage-ner-roberta}
      NER_MODEL_REVISION: ${NER_MODEL_REVISION:-v1}
      NER_PRELOAD: "True"
      NER_CPU_THREADS: ${NER_CPU_THREADS:-2}
      HF_TOKEN: ${HF_TOKEN:-}
    command: ["celery", "-A", "config", "worker", "-Q", "llm", "--pool", "threads", "--concurrency", "4", "-n", "llm@%h", "--loglevel", "INFO"]
    volumes:
      - ./backend:/app
      # Descomprimir ai_triage_ner_roberta.zip del notebook en ml/ner/output/ (fuera de git).
      - ./ml/ner/output:/models/ner:ro
      # Modelo descargado del Hub, si NER_MODEL_PATH es un repositorio.
      - ner_model_cache:/home/appuser/.cache/huggingface
    networks:
      - ai_triage_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d llm@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          # RoBERTa-base en float32 (~0,5 GB) mas torch y el pool de hilos de Gemini.
          memory: 2G

  # LLM local opcional (segundo motor de triaje): Ollama con API compatible con OpenAI.
  #   docker compose --profile llm-local up -d
  #   docker compose exec llm-local ollama pull gemma4:e4b-it-qat
  # Sin puertos al host: solo lo alcanzan backend y worker-llm por la red interna. Con GPU NVIDIA,
  # docker-compose.gpu.yml le reserva la GPU.
  llm-local:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.34.4}
    container_name: ai_triage_llm_local
    profiles: ["llm-local"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai_triage_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # Gemma 4 E4B QAT ocupa ~7 GB en memoria (Qwen2.5-7B Q4_K_M ~5 GB).
          memory: ${OLLAMA_MEMORY_LIMIT:-10G}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cantor11/ai-triage-frontend:latest
    container_name: ai_triage_frontend
    restart: unless-stopped
    # Sin env_file: el frontend no necesita SECRET_KEY ni las API keys del backend.
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
      - NEXT_PUBLIC_FHIR_URL=${FHIR_SERVER_URL:-}
    networks:
      - ai_triage_network
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: cantor11/ai-triage-nginx:latest
    container_name: ai_triage_nginx
    restart: unless-stopped
    environment:
      # Nombre del certificado autofirmado y duracion de HSTS (0 en desarrollo; 31536000 en produccion).
      - TLS_SERVER_NAME=${TLS_SERVER_NAME:-localhost}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificados persistentes; para produccion montar aqui fullchain.pem y privkey.pem reales.
      - nginx_certs:/etc/nginx/certs
    networks:
      - ai_triage_network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ai_triage_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  audio_uploads:
  nginx_certs:
  asr_model_cache:
  ner_model_cache:
  ollama_models:
