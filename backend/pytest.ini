[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = accounts patients triage system_settings transcription
norecursedirs = .venv venv build dist staticfiles
addopts = --reuse-db -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning