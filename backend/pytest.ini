[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = accounts patients triage system_settings transcription core
norecursedirs = .venv venv build dist staticfiles
addopts = --reuse-db -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Sin collectstatic WhiteNoise avisa de que falta STATIC_ROOT; en tests se usan los finders.
    ignore:No directory at:UserWarning
